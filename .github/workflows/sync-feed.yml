name: Sync Product Feed

on:
  schedule:
    # Täglich um 6:00 Uhr (UTC) = 7:00 Uhr MEZ
    - cron: '0 6 * * *'
  workflow_dispatch: # Manuell auslösbar über GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch product feed
        run: curl -s -o feed.xml "https://www.jeanlen.de/store-api/product-export/SWPERW1QSK80Z1DSAHHWCDIZRA/chatchamp.xml"

      - name: Update articles.json
        run: python3 sync-ci.py

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet articles.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Keine Änderungen – articles.json ist aktuell."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            ADDED=$(python3 -c "
          import json
          old = {a['sku'] for a in json.load(open('articles.json.bak'))['articles']} if __import__('os').path.exists('articles.json.bak') else set()
          new = {a['sku'] for a in json.load(open('articles.json'))['articles']}
          print(len(new - old))
          ")
            echo "Änderungen gefunden – $ADDED neue Artikel."
          fi

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git commit -m "Auto-Sync: Artikeldaten aktualisiert ($(date +%d.%m.%Y))"
          git push
